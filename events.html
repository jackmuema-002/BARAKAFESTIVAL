<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventBook — Browse Events</title>
  <link rel="stylesheet" href="css/event.css" />
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">Event<span>Book</span></a>
      <nav class="nav-links" id="mainNav">
        <a href="index.html">Home</a>
        <a href="events.html" class="active">Events</a>
        <a href="login.html">Log In</a>
        <a href="register.html" class="btn btn-primary">Create Account</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-header">
        <h1>All Upcoming Events</h1>
      </div>

      <!-- Search & Category Filter Controls -->
      <div class="filter-bar">
        <input type="text" id="eventSearch" placeholder="Filter by title or city..." />
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="all">All Categories</option>
          <option value="Tech">Tech</option>
          <option value="Music">Music</option>
          <option value="Workshop">Workshop</option>
          <option value="Business">Business</option>
        </select>
      </div>

      <div id="bookingMessage" class="alert"></div>
      <div class="grid-3" id="allEventsGrid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 EventBook. Built with HTML, CSS &amp; JavaScript.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
