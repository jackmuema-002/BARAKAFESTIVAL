<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventBook — Log In</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">Event<span>Book</span></a>
      <nav class="nav-links" id="mainNav">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="login.html" class="active">Log In</a>
        <a href="register.html" class="btn btn-primary">Create Account</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="auth-wrapper">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to manage your bookings and tickets.</p>

      <div id="loginAlert" class="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="Enter your password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 EventBook. Built with HTML, CSS &amp; JavaScript.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
