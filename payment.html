<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventBook — Checkout &amp; Payment</title>
  <link rel="stylesheet" href="css/payment.css" />
</head>
<body>

  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand">Event<span>Book</span></a>
      <nav class="nav-links" id="mainNav">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="dashboard.html">My Tickets</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="auth-wrapper">
      <h1>Complete Your Booking</h1>
      <p class="subtitle">Review your selected event and enter your payment details.</p>

      <!-- Populated automatically by js/app.js -->
      <div id="paymentSummary" class="payment-summary"></div>

      <div id="paymentAlert" class="alert"></div>

      <form id="paymentForm" novalidate>
        <div class="form-group">
          <label for="paymentMethod">Payment Method</label>
          <select id="paymentMethod">
            <option value="M-Pesa">M-Pesa Express</option>
            <option value="Card">Debit / Credit Card</option>
          </select>
        </div>

        <div class="form-group" id="mpesaGroup">
          <label for="mpesaPhone">M-Pesa Phone Number</label>
          <input type="tel" id="mpesaPhone" placeholder="0712 345 678" />
        </div>

        <div class="form-group" id="cardGroup" style="display: none;">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" maxlength="19" placeholder="4532 •••• •••• 1234" />
        </div>

        <div class="form-group">
          <label for="ticketQty">Number of Tickets</label>
          <input type="number" id="ticketQty" min="1" max="10" value="1" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Confirm &amp; Pay</button>
      </form>

      <p class="auth-footer">
        Changed your mind? <a href="index.html">Cancel and return home</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 EventBook. Built with HTML, CSS &amp; JavaScript.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
